services:
    wordpress:
        image: wp_pokemon
        ports:
            - "80"
        labels:
            - traefik.enable=true
            - traefik.http.routers.pokeclub.rule=Host(`pokeclub.ju2breizh.fr`)
        build:
            context: .
        volumes:
            - ./wp-content/uploads:/var/www/html/wp-content/uploads
        networks:
            - wpnet
            - webgateway
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        ports:
            - "1810:80"
        environment:
            PMA_HOST: ${DB_HOST}
            PMA_USER: ${DB_USER}
            PMA_PASSWORD: ${DB_PASSWORD}
        networks:
            - wpnet

    db:
        image: mysql:latest
        ports:
            - "3306"
        environment:
            MYSQL_DATABASE: ${DB_HOST}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - db_data:/var/lib/mysql
        networks:
            - wpnet

volumes:
    db_data:

networks:
    wpnet:
    webgateway:
        external: true
